<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Ticket Templates – Verification Fixture</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #eef2f6; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; }
      .topbar { flex: none; height: 54px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: #172b3a; color: #fff; }
      .topbar strong { font-size: 15px; }
      .crumb { color: #b9c8d3; font-size: 13px; }
      .shortcut { margin-left: auto; color: #b9c8d3; font-size: 13px; }
      .shortcut kbd { padding: 2px 6px; border: 1px solid #46596a; border-radius: 4px; background: #223a4d; color: #fff; }
      #stage { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <div class="topbar">
      <strong>Service Desk</strong><span class="crumb">Incidents / Create</span>
      <span class="shortcut">Press <kbd>Ctrl</kbd> + <kbd>Space</kbd> for templates</span>
    </div>
    <!-- preview.tsx fills the stage with nested shadow roots and a gsft_main-style
         iframe holding the classic incident form, mirroring the Next Experience UI. -->
    <div id="stage"></div>
    <div id="root"></div>
    <script type="module" src="./preview.tsx"></script>
  </body>
</html>
